plugins {
    id 'com.android.application'
}

android {
    namespace 'com.prostudio.mobile'
    compileSdk 35

    defaultConfig {
        applicationId "com.prostudio.mobile"
        minSdk 26
        targetSdk 35
        versionCode 2400
        versionName "2.4.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
